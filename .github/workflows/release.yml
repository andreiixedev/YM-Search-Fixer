name: Build and Release

on:
  push:
    tags:
      - 'v*'  
  workflow_dispatch:  
jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
    
    - name: Initialize Go module (if not exists)
      run: |
        if (-not (Test-Path "go.mod")) {
          go mod init yahoo-fix
        }
    
    - name: Install dependencies
      run: go mod tidy
    
    - name: Build for Windows amd64
      run: |
        $env:GOOS="windows"
        $env:GOARCH="amd64"
        $env:CGO_ENABLED="0"
        go build -ldflags="-s -w" -o "yahoo-fix.exe" main.go
    
    - name: Create ZIP archive
      run: |
        Compress-Archive -Path "yahoo-fix.exe" -DestinationPath "yahoo-fix.zip"
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: yahoo-fix
        path: |
          yahoo-fix.exe
          yahoo-fix.zip
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          yahoo-fix.exe
          yahoo-fix.zip
        generate_release_notes: true
        body: |
          ## Yahoo Web Search Fixer
          
          Fix for Yahoo Messenger web search issue.
          
          ### [>>] Download:
          - **yahoo-fix.exe** - Executable (64-bit)
          - **yahoo-fix.zip** - ZIP Archive
          
          ### [>>] Instructions:
          1. Download the `.exe` or `.zip` file
          2. Run with **Run as Administrator**
          3. Follow the on-screen instructions
          
          ### [>>] Note:
          This program requires administrator privileges to modify compatibility settings in the registry.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}